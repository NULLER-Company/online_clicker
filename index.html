<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clicker online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-primary: #0a0a1a;
    --bg-secondary: #12122a;
    --bg-card: #1a1a3e;
    --accent: #7c5cfc;
    --accent-light: #a78bfa;
    --accent-glow: rgba(124, 92, 252, 0.4);
    --accent-secondary: #06d6a0;
    --text-primary: #f0f0ff;
    --text-secondary: #9896b0;
    --text-muted: #5a587a;
    --border: rgba(124, 92, 252, 0.2);
    --danger: #ff6b6b;
}

html, body {
    height: 100%;
    overflow: hidden; /* Запрещаем скролл страницы */
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: none; /* Запрет зума пальцами */
}

body { display: flex; flex-direction: column; }

/* ===== РЕГИСТРАЦИЯ ===== */
#registration-screen {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-primary);
}
#reg-bg-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.reg-container {
    position: relative; z-index: 1;
    background: rgba(26, 26, 62, 0.85); backdrop-filter: blur(30px);
    border: 1px solid var(--border); border-radius: 24px;
    padding: 40px 30px; width: 90%; max-width: 400px; text-align: center;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 60px var(--accent-glow);
}
.reg-logo-canvas { width: 80px; height: 80px; margin: 0 auto 15px; }
.reg-container h1 { font-size: 26px; font-weight: 900; color: var(--accent-light); margin-bottom: 5px; }
.reg-container p { color: var(--text-secondary); font-size: 14px; margin-bottom: 25px; }
.input-wrapper input {
    width: 100%; padding: 16px; background: rgba(255,255,255,0.05);
    border: 2px solid var(--border); border-radius: 14px;
    color: #fff; font-size: 16px; outline: none; margin-bottom: 15px; text-align: center;
}
.input-wrapper input:focus { border-color: var(--accent); }
.reg-btn {
    width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent), #6341e0);
    border: none; border-radius: 14px; color: white; font-size: 16px; font-weight: 700; cursor: pointer;
}

/* ===== ИГРА (ШАПКА) ===== */
#game-screen { display: none; flex-direction: column; height: 100dvh; }
.game-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 15px; background: rgba(18, 18, 42, 0.95);
    border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo-canvas { width: 30px; height: 30px; }
.header-title { font-size: 16px; font-weight: 800; color: var(--accent-light); }
.header-user { display: flex; align-items: center; gap: 8px; background: rgba(124, 92, 252, 0.1); padding: 5px 12px; border-radius: 10px; }
.header-user-icon { width: 22px; height: 22px; }
.header-user span { font-size: 13px; font-weight: 600; }

/* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
.game-main { flex: 1; display: flex; overflow: hidden; padding: 10px; gap: 10px; position: relative; }

/* Универсальный стиль панелей */
.panel {
    background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
}
.panel-header {
    padding: 12px 14px; font-size: 14px; font-weight: 700;
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.panel-header-icon { width: 20px; height: 20px; }

/* ===== ЦЕНТР (КЛИКЕР) ===== */
.panel-center { flex: 1; align-items: center; justify-content: center; }
.stats-row { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 320px; padding: 0 10px; }
.stat-card { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; }
.stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
.stat-value { font-size: 24px; font-weight: 900; color: #fff; }
.stat-value.level-val { color: var(--accent-secondary); }

.clicker-area { position: relative; margin: 10px 0; display: flex; align-items: center; justify-content: center; }
/* Увеличенный размер для мобильных */
#click-canvas { width: 240px; height: 240px; cursor: pointer; touch-action: none; }
#particles-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.bars-container { width: 100%; max-width: 320px; padding: 0 15px; margin-top: 15px; }
.bar-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; margin-bottom: 5px; color: var(--text-secondary); }
.bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.bar-fill { height: 100%; border-radius: 10px; transition: width 0.2s ease; }
#energy-bar { background: linear-gradient(90deg, #06d6a0, #04b890); }
#level-bar { background: linear-gradient(90deg, #7c5cfc, #a78bfa); }

/* ===== ЛЕВАЯ ПАНЕЛЬ (ЛИДЕРЫ) ===== */
.panel-left { width: 280px; }
.leaderboard-list { flex: 1; overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
.lb-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; margin-bottom: 4px; background: rgba(255,255,255,0.02); }
.lb-item.is-me { background: rgba(124, 92, 252, 0.15); border: 1px solid var(--border); }
.lb-rank { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; border-radius: 8px; }
.rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; }
.rank-2 { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); color: #000; }
.rank-3 { background: linear-gradient(135deg, #CD7F32, #B8860B); color: #fff; }
.rank-other { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
.lb-info { flex: 1; min-width: 0; }
.lb-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.lb-clicks { font-size: 11px; color: var(--text-muted); }

/* ===== ПРАВАЯ ПАНЕЛЬ (ЧАТ) ===== */
.panel-right { width: 300px; }
.chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
.chat-msg { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,0.05); }
.chat-msg-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
.chat-msg-name { font-size: 12px; font-weight: 700; color: var(--accent-light); }
.chat-msg-time { font-size: 10px; color: var(--text-muted); }
.chat-msg-text { font-size: 13px; color: #fff; word-break: break-word; line-height: 1.4; }
.chat-input-area { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.chat-input-area input { flex: 1; padding: 10px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; color: #fff; outline: none; }
.chat-send-btn { width: 40px; height: 40px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; }

/* ===== НИЖНЯЯ НАВИГАЦИЯ (Только для телефонов) ===== */
.bottom-nav {
    display: none; background: rgba(18, 18, 42, 0.95); border-top: 1px solid var(--border);
    padding: 10px 15px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
}
.nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 600;
}
.nav-btn.active { color: var(--accent-secondary); }
.nav-btn canvas { width: 24px; height: 24px; filter: grayscale(1) opacity(0.5); transition: 0.2s; }
.nav-btn.active canvas { filter: none; transform: scale(1.1); }

/* ===== АДАПТИВНОСТЬ (МОБИЛЬНЫЙ ИНТЕРФЕЙС) ===== */
@media (max-width: 850px) {
    .panel-left, .panel-right { width: 100%; position: absolute; inset: 10px; height: calc(100% - 20px); z-index: 2; transition: opacity 0.2s; }
    .panel-center { width: 100%; position: absolute; inset: 10px; height: calc(100% - 20px); z-index: 1; }
    
    /* Скрытие неактивных панелей */
    .panel { display: none; }
    .panel.active-tab { display: flex; }

    .bottom-nav { display: flex; z-index: 100; }
    #click-canvas { width: 280px; height: 280px; } /* Огромная кнопка на телефоне */
}

/* Обратная связь клика */
.click-feedback { position: fixed; font-size: 24px; font-weight: 900; color: #fff; pointer-events: none; text-shadow: 0 0 10px var(--accent); animation: floatUp 0.6s ease-out forwards; z-index: 999; }
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(0.6); } }
</style>
</head>
<body>

<!-- РЕГИСТРАЦИЯ -->
<div id="registration-screen">
    <canvas id="reg-bg-canvas"></canvas>
    <div class="reg-container">
        <canvas id="reg-logo" class="reg-logo-canvas" width="160" height="160"></canvas>
        <h1>Clicker online</h1>
        <p>Ваш путь к вершине начинается здесь</p>
        <div class="input-wrapper">
            <input type="text" id="nickname-input" placeholder="Введите никнейм" maxlength="15" autocomplete="off">
        </div>
        <button class="reg-btn" id="reg-btn" onclick="register()">Войти в игру</button>
        <div id="reg-error" style="color:var(--danger); font-size:12px; margin-top:10px; height:15px;"></div>
    </div>
</div>

<!-- ИГРА -->
<div id="game-screen">
    <header class="game-header">
        <div class="header-left">
            <canvas id="header-logo" class="header-logo-canvas" width="60" height="60"></canvas>
            <span class="header-title">Clicker online</span>
        </div>
        <div class="header-user">
            <canvas id="header-user-icon" class="header-user-icon" width="44" height="44"></canvas>
            <span id="header-nickname">Игрок</span>
        </div>
    </header>

    <main class="game-main">
        <!-- ТАБЛИЦА ЛИДЕРОВ -->
        <aside class="panel panel-left" id="tab-leaderboard">
            <div class="panel-header">🏆 Топ 10 Игроков</div>
            <div class="leaderboard-list" id="leaderboard-list"></div>
        </aside>

        <!-- КЛИКЕР -->
        <section class="panel panel-center active-tab" id="tab-clicker">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-label">Клики</div>
                    <div class="stat-value" id="clicks-display">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Уровень</div>
                    <div class="stat-value level-val" id="level-display">1</div>
                </div>
            </div>

            <div class="clicker-area" id="clicker-area">
                <canvas id="click-canvas" width="400" height="400"></canvas>
                <canvas id="particles-canvas" width="400" height="400"></canvas>
            </div>

            <div class="bars-container">
                <div class="bar-header">
                    <span>Энергия</span>
                    <span id="energy-text">100 / 100</span>
                </div>
                <div class="bar-bg"><div class="bar-fill" id="energy-bar" style="width:100%;"></div></div>

                <div class="bar-header">
                    <span>До уровня</span>
                    <span id="level-progress-label">0 / 1000</span>
                </div>
                <div class="bar-bg"><div class="bar-fill" id="level-bar" style="width:0%;"></div></div>
            </div>
        </section>

        <!-- ЧАТ -->
        <aside class="panel panel-right" id="tab-chat">
            <div class="panel-header">💬 Общий чат</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Сообщение...">
                <button class="chat-send-btn" onclick="sendChat()">➤</button>
            </div>
        </aside>
    </main>

    <!-- МОБИЛЬНАЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <button class="nav-btn" onclick="switchTab('leaderboard', this)">
            <canvas id="nav-icon-lb" width="48" height="48"></canvas>
            Топ
        </button>
        <button class="nav-btn active" onclick="switchTab('clicker', this)">
            <canvas id="nav-icon-click" width="48" height="48"></canvas>
            Клик
        </button>
        <button class="nav-btn" onclick="switchTab('chat', this)">
            <canvas id="nav-icon-chat" width="48" height="48"></canvas>
            Чат
        </button>
    </nav>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ============================================================
// FIREBASE CONFIG - ВСТАВЬТЕ СЮДА СВОИ ДАННЫЕ ИЗ КОНСОЛИ!
// ============================================================
const firebaseConfig = {
    apiKey: "AIzaSyDunk-eA8oiY4SwbCql0D-h9EyVYL-wwiA",
    authDomain: "clicker-94702.firebaseapp.com",
    databaseURL: "https://clicker-94702-default-rtdb.europe-west1.firebasedatabase.app", 
    projectId: "clicker-94702",
    storageBucket: "clicker-94702.firebasestorage.app",
    messagingSenderId: "1085651157718",
    appId: "1:1085651157718:web:55f45d11b1883b0ae33f77"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============================================================
// ПЕРЕМЕННЫЕ
// ============================================================
let userId = localStorage.getItem('cv_uid') || null;
let userNickname = localStorage.getItem('cv_nick') || '';
let clicks = parseInt(localStorage.getItem('cv_clicks')) || 0;
let level = parseInt(localStorage.getItem('cv_level')) || 1;
let energy = 100;
const MAX_ENERGY = 100;
const ENERGY_COST = 1;
const ENERGY_REGEN = 4; // Скорость восстановления энергии в сек
const CLICKS_PER_LEVEL = 1000;

let clickBtnScale = 1;
let particles = [];
let audioCtx = null;

// ============================================================
// ЗВУК КЛИКА (Генерация без файлов)
// ============================================================
function playClickSound() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    // Приятный короткий "Поп" звук
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime); // Громкость
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

// ============================================================
// НАВИГАЦИЯ ДЛЯ ТЕЛЕФОНА (ВКЛАДКИ)
// ============================================================
function switchTab(tabName, btnElement) {
    // Если мы на компьютере, вкладки не скрываются, эта функция нужна только мобильным
    if (window.innerWidth > 850) return; 

    // Скрываем все
    document.getElementById('tab-leaderboard').classList.remove('active-tab');
    document.getElementById('tab-clicker').classList.remove('active-tab');
    document.getElementById('tab-chat').classList.remove('active-tab');
    
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

    // Показываем нужную
    document.getElementById('tab-' + tabName).classList.add('active-tab');
    btnElement.classList.add('active');

    // Прокрутка чата вниз при открытии
    if(tabName === 'chat') {
        const c = document.getElementById('chat-messages');
        c.scrollTop = c.scrollHeight;
    }
}

// ============================================================
// ОТРИСОВКА ИКОНОК
// ============================================================
function drawLogo(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, cx = w/2, r = w*0.4;
    ctx.clearRect(0,0,w,w);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const a = Math.PI/6 + (Math.PI/3)*i;
        ctx.lineTo(cx+r*Math.cos(a), cx+r*Math.sin(a));
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(0,0,w,w);
    g.addColorStop(0,'#7c5cfc'); g.addColorStop(1,'#06d6a0');
    ctx.fillStyle = g; ctx.fill();
}

function drawClickButton() {
    const canvas = document.getElementById('click-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, cx = w/2, baseR = w*0.4;
    ctx.clearRect(0,0,w,w);

    const r = baseR * clickBtnScale;

    // Тень/Свечение
    ctx.beginPath(); ctx.arc(cx, cx, r, 0, Math.PI*2);
    ctx.shadowColor = '#7c5cfc'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;

    // Кнопка
    const g = ctx.createRadialGradient(cx-r*0.3, cx-r*0.3, 0, cx, cx, r);
    g.addColorStop(0,'#9d7bff'); g.addColorStop(1,'#5a3ce0');
    ctx.fillStyle = g; ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    // Обводка зависящая от энергии
    ctx.beginPath(); ctx.arc(cx, cx, r+4, 0, Math.PI*2);
    ctx.strokeStyle = energy > 20 ? '#06d6a0' : '#ff6b6b'; 
    ctx.lineWidth = 4; ctx.stroke();

    // Текст
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${w*0.12}px 'Inter'`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('КЛИК', cx, cx);

    requestAnimationFrame(drawClickButton);
}

// ============================================================
// РЕГИСТРАЦИЯ
// ============================================================
async function register() {
    const nick = document.getElementById('nickname-input').value.trim();
    const err = document.getElementById('reg-error');
    if(nick.length < 2) { err.textContent = 'Минимум 2 символа!'; return; }
    
    document.getElementById('reg-btn').textContent = 'Вход...';

    // Создаем ID если его нет
    if(!userId) userId = 'u_' + Math.random().toString(36).substr(2,9);
    userNickname = nick;
    
    // Сохраняем локально сразу
    localStorage.setItem('cv_uid', userId);
    localStorage.setItem('cv_nick', userNickname);

    // Запускаем игру
    startGame();
    
    // Асинхронно обновляем БД
    db.ref('users/' + userId).update({ 
        nickname: userNickname, 
        clicks: clicks, 
        level: level 
    });
}

// ============================================================
// ЗАПУСК ИГРЫ
// ============================================================
function startGame() {
    document.getElementById('registration-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    document.getElementById('header-nickname').textContent = userNickname;

    drawLogo(document.getElementById('header-logo'));
    drawLogo(document.getElementById('nav-icon-click'));
    
    // Рисуем простенькие иконки для навигации
    const lbCtx = document.getElementById('nav-icon-lb').getContext('2d');
    lbCtx.fillStyle = '#fff'; lbCtx.fillRect(16, 24, 16, 16); lbCtx.fillRect(8, 30, 6, 10); lbCtx.fillRect(34, 16, 6, 24);
    
    const chCtx = document.getElementById('nav-icon-chat').getContext('2d');
    chCtx.fillStyle = '#fff'; chCtx.beginPath(); chCtx.roundRect(8,12,32,20,5); chCtx.fill(); chCtx.moveTo(15,32); chCtx.lineTo(20,40); chCtx.lineTo(25,32); chCtx.fill();

    updateUI();
    drawClickButton();
    setupClicker();
    
    // Интервалы
    setInterval(() => { if(energy < MAX_ENERGY) { energy = Math.min(MAX_ENERGY, energy + ENERGY_REGEN*0.1); updateUI(); } }, 100);
    setInterval(() => { 
        db.ref('users/' + userId).update({ clicks: clicks, level: level });
        localStorage.setItem('cv_clicks', clicks);
        localStorage.setItem('cv_level', level);
    }, 5000);

    // Подключаем БД
    listenLeaderboard();
    listenChat();
}

// ============================================================
// КЛИКЕР ЛОГИКА
// ============================================================
function setupClicker() {
    const cvs = document.getElementById('click-canvas');
    const handler = (e) => {
        e.preventDefault(); // Блокирует зум и двойные клики на телефоне
        if(energy < ENERGY_COST) return;
        
        energy -= ENERGY_COST;
        clicks++;
        level = Math.floor(clicks / CLICKS_PER_LEVEL) + 1;
        
        clickBtnScale = 0.9;
        setTimeout(() => clickBtnScale = 1, 80);
        
        playClickSound(); // Звук!

        // Анимация +1
        const touch = e.touches ? e.touches[0] : e;
        const fb = document.createElement('div');
        fb.className = 'click-feedback';
        fb.textContent = '+1';
        fb.style.left = (touch.clientX - 10) + 'px';
        fb.style.top = (touch.clientY - 20) + 'px';
        document.body.appendChild(fb);
        setTimeout(() => fb.remove(), 600);

        updateUI();
    };
    cvs.addEventListener('mousedown', handler);
    cvs.addEventListener('touchstart', handler, {passive: false});
}

function updateUI() {
    document.getElementById('clicks-display').textContent = clicks.toLocaleString('ru-RU');
    document.getElementById('level-display').textContent = level;
    document.getElementById('energy-text').textContent = Math.floor(energy) + ' / ' + MAX_ENERGY;
    document.getElementById('energy-bar').style.width = energy + '%';
    
    const progress = clicks % CLICKS_PER_LEVEL;
    document.getElementById('level-progress-label').textContent = `${progress} / ${CLICKS_PER_LEVEL}`;
    document.getElementById('level-bar').style.width = (progress / CLICKS_PER_LEVEL * 100) + '%';
}

// ============================================================
// ИСПРАВЛЕННАЯ ТАБЛИЦА ЛИДЕРОВ
// ============================================================
function listenLeaderboard() {
    // Получаем топ 15 игроков по количеству кликов
    db.ref('users').orderByChild('clicks').limitToLast(15).on('value', snap => {
        const list = document.getElementById('leaderboard-list');
        const users = [];
        
        snap.forEach(child => {
            users.push({ id: child.key, ...child.val() });
        });
        
        // Сортируем от большего к меньшему
        users.sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
        list.innerHTML = '';
        
        if(users.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#5a587a; margin-top:20px;">Пока пусто</div>';
            return;
        }

        users.forEach((u, i) => {
            const rank = i + 1;
            const isMe = (u.id === userId);
            let rc = 'rank-other';
            if (rank===1) rc='rank-1'; else if (rank===2) rc='rank-2'; else if (rank===3) rc='rank-3';

            list.innerHTML += `
                <div class="lb-item ${isMe ? 'is-me' : ''}">
                    <div class="lb-rank ${rc}">${rank}</div>
                    <div class="lb-info">
                        <div class="lb-name">${u.nickname || 'Аноним'}</div>
                        <div class="lb-clicks">${(u.clicks || 0).toLocaleString('ru-RU')} кликов (Ур. ${u.level || 1})</div>
                    </div>
                </div>
            `;
        });
    });
}

// ============================================================
// ЧАТ
// ============================================================
function listenChat() {
    db.ref('chat').limitToLast(30).on('child_added', snap => {
        const m = snap.val();
        const c = document.getElementById('chat-messages');
        c.innerHTML += `
            <div class="chat-msg">
                <div class="chat-msg-header">
                    <span class="chat-msg-name">${m.nickname}</span>
                </div>
                <div class="chat-msg-text">${m.text}</div>
            </div>
        `;
        c.scrollTop = c.scrollHeight;
    });
}

function sendChat() {
    const inp = document.getElementById('chat-input');
    if(!inp.value.trim()) return;
    db.ref('chat').push({ nickname: userNickname, text: inp.value.trim() });
    inp.value = '';
}

// Автологин
window.onload = () => {
    if(localStorage.getItem('cv_nick') && localStorage.getItem('cv_uid')) {
        startGame();
    } else {
        // Фоновый эффект
        const c = document.getElementById('reg-bg-canvas');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        setInterval(()=>{
            ctx.fillStyle = 'rgba(10,10,26,0.1)'; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle = '#7c5cfc'; ctx.beginPath(); ctx.arc(Math.random()*c.width, Math.random()*c.height, Math.random()*2, 0, 7); ctx.fill();
        }, 50);
    }
};
